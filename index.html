<!DOCTYPE html>
<html lang="pt-br" style="background-color: #000000 !important;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ESTACIONAMENTO DETRAN - CAIXA</title>
         
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root { 
            --gold: #fde047; 
            --blue: #06b6d4; 
            --green: #10b981; 
            --red: #ef4444; 
            --dark: #020617; 
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            background: #000; color: white; font-family: 'Segoe UI', sans-serif; 
            margin: 0; padding: 15px; height: 100vh; display: flex; flex-direction: column; 
            overflow-y: auto; border: 4px solid var(--blue);
        }

        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); padding-bottom: 10px; margin-bottom: 15px; }
        
        .painel-lancamento { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .btn-tipo { background: #0f172a; border: 2px solid var(--gold); color: white; padding: 15px 10px; border-radius: 8px; font-weight: 900; font-size: 14px; cursor: pointer; text-align: center; display: flex; flex-direction: column; gap: 5px; align-items: center; }
        .btn-tipo.pix { border-color: var(--blue); color: var(--blue); }
        .btn-tipo.dinheiro { border-color: var(--green); color: var(--green); }
        .btn-tipo.cartao { border-color: var(--gold); color: var(--gold); }

        .resumo-atual { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .linha-resumo { display: flex; justify-content: space-between; font-size: 16px; font-weight: bold; border-bottom: 1px solid #1e293b; padding-bottom: 8px; }

        .bloco-observacao { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
        .bloco-observacao label { color: var(--gold); font-size: 13px; font-weight: 900; }
        .bloco-observacao textarea { width: 100%; background: #020617; border: 1px solid #475569; color: white; padding: 10px; border-radius: 6px; font-size: 14px; resize: none; height: 75px; line-height: 1.3; }

        .acoes-inferiores { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .btn-acao { background: var(--green); border: none; color: #000; padding: 15px; border-radius: 8px; font-weight: 900; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
        .btn-limpar-obs { background: #334155; border: 1px solid #64748b; color: #f8fafc; padding: 15px; border-radius: 8px; font-weight: 900; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }

        /* Modal customizado para evitar o prompt padrão do navegador com a URL */
        #modal-custom { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; padding: 20px; }
        .modal-conteudo { background: #0f172a; border: 2px solid var(--gold); border-radius: 12px; padding: 20px; width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 15px; }
        .modal-titulo { font-size: 16px; font-weight: 900; color: var(--gold); text-align: center; }
        .modal-input { width: 100%; background: #020617; border: 1px solid #475569; color: white; padding: 12px; border-radius: 8px; font-size: 18px; text-align: center; font-weight: bold; }
        .modal-botoes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .modal-btn-cancelar { background: #334155; border: none; color: white; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .modal-btn-ok { background: var(--green); border: none; color: #000; padding: 12px; border-radius: 6px; font-weight: 900; cursor: pointer; }

        /* Área oculta para renderização da imagem via html2canvas */
        #area-foto-canvas { background: white; color: black; padding: 30px; width: 500px; position: absolute; left: -9999px; top: 0; }
        .foto-titulo { text-align: center; font-size: 20px; font-weight: bold; color: black; margin: 0; }
        .foto-data { text-align: center; font-size: 13px; font-weight: bold; color: #333; margin-top: 5px; margin-bottom: 20px; }
        .foto-linha { display: flex; justify-content: space-between; font-size: 16px; font-weight: bold; padding: 12px 0; border-bottom: 1px solid #ccc; color: black; }
        .foto-total { display: flex; justify-content: space-between; font-size: 20px; font-weight: bold; padding-top: 15px; margin-top: 15px; border-top: 3px solid black; color: black; }
        .foto-obs-container { margin-top: 20px; border: 2px dashed #666; padding: 12px; border-radius: 6px; background: #f8fafc; display: none; }
        .foto-obs-titulo { font-size: 12px; font-weight: bold; color: #333; margin-bottom: 4px; text-transform: uppercase; }
        .foto-obs-texto { font-size: 13px; color: black; white-space: pre-wrap; word-break: break-word; line-height: 1.4; }
    </style>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#bf953f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" sizes="192x192" href="icon-192.png">
    <link rel="icon" sizes="512x512" href="icon-512.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    
</head>
<body>

    <div class="header">
        <div style="color:#fde047; font-weight:900; font-size:16px;"><i class="fas fa-parking" style="margin-right:8px;"></i>ESTACIONAMENTO DETRAN</div>
        <button onclick="zerarCaixa()" style="background:#ef4444; color:white; border:none; padding:8px 12px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:12px;"><i class="fas fa-trash"></i> ZERAR TUDO</button>
    </div>
    
    <div class="painel-lancamento">
        <button class="btn-tipo pix" onclick="abrirModalValor('PIX')">
            <i class="fas fa-qrcode fa-lg"></i> + PIX
        </button>
        <button class="btn-tipo dinheiro" onclick="abrirModalValor('DINHEIRO')">
            <i class="fas fa-money-bill-wave fa-lg"></i> + DINHEIRO
        </button>
        <button class="btn-tipo cartao" onclick="abrirModalValor('CARTAO')">
            <i class="fas fa-credit-card fa-lg"></i> + CARTÃO
        </button>
    </div>

    <div class="resumo-atual">
        <div class="linha-resumo" style="color: var(--blue);">
            <span>PIX:</span>
            <span id="txt-pix">R$ 0,00</span>
        </div>
        <div class="linha-resumo" style="color: var(--green);">
            <span>DINHEIRO:</span>
            <span id="txt-dinheiro">R$ 0,00</span>
        </div>
        <div class="linha-resumo" style="color: var(--gold);">
            <span>CARTÃO:</span>
            <span id="txt-cartao">R$ 0,00</span>
        </div>
        <div class="linha-resumo" style="color: #fff; border-bottom: none; font-size: 18px;">
            <span>TOTAL GERAL:</span>
            <span id="txt-total">R$ 0,00</span>
        </div>
    </div>

    <div class="bloco-observacao">
        <label for="input-obs"><i class="fas fa-comment-alt"></i> OBSERVAÇÃO (ATÉ 3 LINHAS):</label>
        <textarea id="input-obs" placeholder="Digite sua observação aqui..." rows="3" oninput="salvarObservacao()"></textarea>
    </div>

    <div class="acoes-inferiores">
        <button class="btn-limpar-obs" onclick="limparObservacao()">
            <i class="fas fa-eraser"></i> LIMPAR OBS.
        </button>
        <button class="btn-acao" onclick="gerarFotoCanvas()">
            <i class="fas fa-camera"></i> GERAR FOTO
        </button>
    </div>

    <div id="container-resultado" style="margin-top:10px; text-align:center; margin-bottom: 20px;">
        <img id="img-resultado" style="width:100%; max-height:160px; object-fit:contain; display:none; border:2px solid var(--gold); border-radius:8px;">
    </div>

    <!-- Modal Customizado -->
    <div id="modal-custom">
        <div class="modal-conteudo">
            <div class="modal-titulo" id="modal-titulo-texto">DIGITAR VALOR</div>
            <input type="text" id="modal-input-valor" class="modal-input" placeholder="0,00" inputmode="decimal">
            <div class="modal-botoes">
                <button class="modal-btn-cancelar" onclick="fecharModalValor()">Cancelar</button>
                <button class="modal-btn-ok" onclick="confirmarModalValor()">OK</button>
            </div>
        </div>
    </div>

    <!-- Template Oculto para Foto -->
    <div id="area-foto-canvas">
        <div style="border: 4px solid black; padding: 25px; background: #fff;">
            <h1 class="foto-titulo">ESTACIONAMENTO DETRAN</h1>
            <div class="foto-data" id="foto-data-hora"></div>
            
            <div class="foto-linha">
                <span>PIX:</span>
                <span id="foto-val-pix">R$ 0,00</span>
            </div>
            <div class="foto-linha">
                <span>DINHEIRO:</span>
                <span id="foto-val-dinheiro">R$ 0,00</span>
            </div>
            <div class="foto-linha">
                <span>CARTÃO:</span>
                <span id="foto-val-cartao">R$ 0,00</span>
            </div>

            <div class="foto-total">
                <span>VALOR TOTAL:</span>
                <span id="foto-val-total">R$ 0,00</span>
            </div>

            <div class="foto-obs-container" id="foto-obs-box">
                <div class="foto-obs-titulo">Observação:</div>
                <div class="foto-obs-texto" id="foto-obs-conteudo"></div>
            </div>
        </div>
    </div>

    <script>
        let tipoAtual = '';

        function obterCaixa() {
            let caixa = JSON.parse(localStorage.getItem('detran_caixa_valores')) || { pix: 0, dinheiro: 0, cartao: 0 };
            return caixa;
        }

        function salvarCaixa(caixa) {
            localStorage.setItem('detran_caixa_valores', JSON.stringify(caixa));
            atualizarTela();
        }

        function salvarObservacao() {
            const obs = document.getElementById('input-obs').value;
            localStorage.setItem('detran_caixa_obs', obs);
        }

        function carregarObservacao() {
            const obs = localStorage.getItem('detran_caixa_obs') || '';
            document.getElementById('input-obs').value = obs;
        }

        function limparObservacao() {
            document.getElementById('input-obs').value = '';
            localStorage.removeItem('detran_caixa_obs');
        }

        function atualizarTela() {
            const c = obterCaixa();
            document.getElementById('txt-pix').innerText = `R$ ${c.pix.toFixed(2).replace('.', ',')}`;
            document.getElementById('txt-dinheiro').innerText = `R$ ${c.dinheiro.toFixed(2).replace('.', ',')}`;
            document.getElementById('txt-cartao').innerText = `R$ ${c.cartao.toFixed(2).replace('.', ',')}`;
            
            const total = c.pix + c.dinheiro + c.cartao;
            document.getElementById('txt-total').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }

        function abrirModalValor(tipo) {
            tipoAtual = tipo;
            document.getElementById('modal-titulo-texto').innerText = `VALOR EM ${tipo}`;
            const input = document.getElementById('modal-input-valor');
            input.value = '';
            document.getElementById('modal-custom').style.display = 'flex';
            setTimeout(() => input.focus(), 100);
        }

        function fecharModalValor() {
            document.getElementById('modal-custom').style.display = 'none';
        }

        function confirmarModalValor() {
            let valorStr = document.getElementById('modal-input-valor').value;
            if (!valorStr) {
                fecharModalValor();
                return;
            }
            let valor = parseFloat(valorStr.replace(',', '.')) || 0;
            if (valor > 0) {
                let c = obterCaixa();
                if (tipoAtual === 'PIX') c.pix += valor;
                if (tipoAtual === 'DINHEIRO') c.dinheiro += valor;
                if (tipoAtual === 'CARTAO') c.cartao += valor;
                salvarCaixa(c);
            }
            fecharModalValor();
        }

        function zerarCaixa() {
            if (confirm("Deseja zerar todos os valores e a observação do caixa?")) {
                localStorage.removeItem('detran_caixa_valores');
                localStorage.removeItem('detran_caixa_obs');
                document.getElementById('input-obs').value = '';
                atualizarTela();
                document.getElementById('img-resultado').style.display = 'none';
            }
        }

        async function gerarFotoCanvas() {
            const c = obterCaixa();
            const total = c.pix + c.dinheiro + c.cartao;
            const obs = document.getElementById('input-obs').value.trim();

            document.getElementById('foto-data-hora').innerText = "Data e Hora: " + new Date().toLocaleString();
            document.getElementById('foto-val-pix').innerText = `R$ ${c.pix.toFixed(2).replace('.', ',')}`;
            document.getElementById('foto-val-dinheiro').innerText = `R$ ${c.dinheiro.toFixed(2).replace('.', ',')}`;
            document.getElementById('foto-val-cartao').innerText = `R$ ${c.cartao.toFixed(2).replace('.', ',')}`;
            document.getElementById('foto-val-total').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;

            const obsBox = document.getElementById('foto-obs-box');
            if (obs.length > 0) {
                document.getElementById('foto-obs-conteudo').innerText = obs;
                obsBox.style.display = 'block';
            } else {
                obsBox.style.display = 'none';
            }

            setTimeout(async () => {
                const canvas = await html2canvas(document.querySelector("#area-foto-canvas"), { scale: 2 });
                const dataUrl = canvas.toDataURL("image/png");
                
                const img = document.getElementById('img-resultado');
                img.src = dataUrl;
                img.style.display = "block";

                const blob = await (await fetch(dataUrl)).blob();
                const file = new File([blob], 'Resumo_Caixa_Detran.png', { type: 'image/png' });
                
                if (navigator.share) {
                    try {
                        await navigator.share({ files: [file], title: 'Resumo Caixa Estacionamento Detran' });
                    } catch (e) {
                        alert("Foto gerada com sucesso!");
                    }
                } else {
                    alert("Foto gerada com sucesso! Veja o resultado na tela.");
                }
            }, 300);
        }

        carregarObservacao();
        atualizarTela();
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => console.log('SISTEMA JDP: MOTOR ATIVO'));
            });
        }
    </script>
</body>
</html>
